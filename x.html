<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Valentine 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: linear-gradient(135deg, #ffd6e8, #ffeaf2);
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 10;
    }

    h1 {
      color: #ff4f8b;
      margin-bottom: 25px;
      font-size: 2rem;
      text-shadow: 2px 2px white;
    }

    /* Envelope */
    .envelope-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      perspective: 1000px;
    }

    .envelope {
      position: relative;
      width: 300px;
      height: 200px;
      background: #ff8fab;
      border-radius: 0 0 14px 14px;
      cursor: pointer;
      transition: transform 0.4s ease;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      z-index: 5;
    }

    /* Flap */
    .envelope::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffb3c6;
      clip-path: polygon(0 0, 100% 0, 50% 60%);
      border-radius: 14px 14px 0 0;
      transition: transform 0.6s ease;
      transform-origin: top;
      z-index: 6;
    }

    .envelope.open::before {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Letter */
    .letter {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 270px;
      height: 150px;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .letter p {
      font-size: 1.1rem;
      color: #ff4f8b;
      margin: 0;
      line-height: 1.4;
      text-align: center;
    }

    /* Letter expansion when open */
    .envelope.open .letter {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      width: 90vw;
      max-width: 380px;
      height: auto;
      min-height: 300px;
      z-index: 100;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      display: none;
      margin-top: 10px;
    }

    .btn {
      margin-top: 30px;
      background: #ff4f8b;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 6px 15px rgba(255, 79, 139, 0.4);
      position: relative;
      z-index: 20;
    }

    .btn:hover {
      background: #ff2f74;
      transform: translateY(-3px) scale(1.05);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>💌 Hi Jaanu 💌</h1>

    <div class="envelope-wrapper">
      <div class="envelope" id="envelope">
        <div class="letter" id="letter">
          <p id="text">
            Until I see you and actually give you the reaction you deserve, 
            this is me putting my feelings into something I can actually send 💕
          </p>
          <video id="video" controls playsinline>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
    </div>

    <button class="btn" id="openBtn">Open My Heart 💖</button>
  </div>

  <script>
    const envelope = document.getElementById("envelope");
    const button = document.getElementById("openBtn");
    const text = document.getElementById("text");
    const video = document.getElementById("video");

    button.addEventListener("click", () => {
      // 1. Open the flap
      envelope.classList.add("open");
      
      // 2. Hide the button immediately
      button.style.opacity = "0";
      setTimeout(() => button.style.display = "none", 300);

      // 3. Wait for envelope flap, then transition the letter and video
      setTimeout(() => {
        text.style.display = "none";
        video.style.display = "block";
        video.play().catch(error => {
          console.log("Autoplay prevented, user needs to click play on video.");
        });
      }, 800);
    });

    // Floating hearts generator
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      const hearts = ["💖","💕","💗","💝","💘","❤️"];
      heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 10) + "px";
      heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
      document.body.appendChild(heart);
      
      setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 400);
  </script>
</body>
</html>
