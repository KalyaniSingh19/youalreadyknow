<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> My Valentine 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: linear-gradient(135deg, #ffd6e8, #ffeaf2);
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: #ff4f8b;
      margin-bottom: 25px;
      font-size: 2rem;
      text-shadow: 0 0 10px #ffc2d6;
    }

    /* Envelope */
    .envelope {
      position: relative;
      width: 300px;
      height: 200px;
      background: linear-gradient(135deg, #ff8fab, #ffb3c6);
      border-radius: 12px;
      margin: auto;
      cursor: pointer;
      transition: transform 0.4s ease;
      box-shadow: 0 20px 35px rgba(255,105,180,0.35);
    }

    .envelope:hover {
      transform: scale(1.05);
    }

    .envelope:before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffc2d6, #ffd6e8);
      clip-path: polygon(0 0, 100% 0, 50% 50%);
      border-radius: 12px 12px 0 0;
      transition: 0.7s ease;
      transform-origin: top;
    }

    .letter {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      min-height: 120px;
      background: white;
      border-radius: 10px;
      padding: 12px;
      box-sizing: border-box;
      transition: 0.9s ease;
      overflow: visible;
      box-shadow: 0 8px 18px rgba(255,105,180,0.25);
    }

    .letter p {
      font-size: 1rem;
      color: #ff4f8b;
      margin: 0;
      line-height: 1.4;
      animation: fadeIn 1s ease;
    }

    video {
      width: 100%;
      max-height: 300px;
      border-radius: 10px;
      display: none;
      margin-top: 10px;
      object-fit: contain;
      background: linear-gradient(135deg, #ffeaf2, #ffd6e8);
      box-shadow: 0 0 20px rgba(255,105,180,0.6);
      border: 3px solid #ff8fab;
      animation: popIn 0.7s ease;
      cursor: pointer;
    }

    .btn {
      margin-top: 22px;
      background: linear-gradient(135deg, #ff4f8b, #ff2f74);
      color: white;
      border: none;
      padding: 13px 26px;
      font-size: 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 10px 18px rgba(255,47,116,0.4);
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255,105,180,0.7);
    }

    /* Open state */
    .open:before {
      transform: rotateX(180deg);
    }

    .open .letter {
      bottom: 120px;
    }

    .open video {
      display: block;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 22px;
      animation: floatUp 6s linear infinite;
      opacity: 0.85;
      pointer-events: none;
      filter: drop-shadow(0 0 5px #ff8fab);
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.6); opacity: 0; }
    }

    /* Sparkles */
    .sparkle {
      position: fixed;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle, #fff, #ffd6e8);
      border-radius: 50%;
      pointer-events: none;
      animation: sparkle 1.5s ease-out forwards;
    }

    @keyframes sparkle {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile full-screen hint */
    .hint {
      font-size: 0.85rem;
      color: #ff4f8b;
      margin-top: 6px;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>💌 Hi Jaanu 💌</h1>

    <div class="envelope" id="envelope">
      <div class="letter">
        <p id="text">
          Until I see you and actually give you the reaction you deserve,
          this is me putting my feelings into something I can actually send 💖
        </p>
        <iframe 
  src="https://drive.google.com/file/d/1wtkf5i4_UwppGhOLZhOFV9uu8VbYQBtq/view?usp=drive_link" 
  allow="autoplay"
  allowfullscreen
  style="width:100%; height:300px; border-radius:10px; border:none;">
        </iframe>

        <div class="hint" id="hint" style="display:none;"> Tap to expandd 💕</div>
      </div>
    </div>

    <button class="btn" id="openBtn">Open Letter 💕</button>
  </div>

  <script>
    const envelope = document.getElementById("envelope");
    const button = document.getElementById("openBtn");
    const text = document.getElementById("text");
    const video = document.getElementById("video");
    const hint = document.getElementById("hint");

    button.onclick = () => {
      envelope.classList.add("open");
      text.style.display = "none";
      video.style.display = "block";
      hint.style.display = "block";
      video.play();
      sparkleBurst();
    };

    // Fullscreen on tap
    video.addEventListener("click", () => {
      if (video.requestFullscreen) video.requestFullscreen();
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    });

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = ["💖","💕","💗","💝","💘"][Math.floor(Math.random()*5)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }, 350);

    // Sparkle click effect
    document.addEventListener("click", e => {
      const s = document.createElement("div");
      s.className = "sparkle";
      s.style.left = e.clientX + "px";
      s.style.top = e.clientY + "px";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1500);
    });

    function sparkleBurst() {
      for (let i = 0; i < 15; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.style.left = (window.innerWidth / 2 + (Math.random() * 100 - 50)) + "px";
        s.style.top = (window.innerHeight / 2 + (Math.random() * 100 - 50)) + "px";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1500);
      }
    }
  </script>
</body>
</html>
