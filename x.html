<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Valentine 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: linear-gradient(135deg, #ffd6e8, #ffeaf2);
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      color: #ff4f8b;
      margin-bottom: 25px;
      font-size: 2rem;
    }

    /* Envelope */
    .envelope-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .envelope {
      position: relative;
      width: 320px;
      height: 210px;
      background: #ff8fab;
      border-radius: 14px;
      margin: auto;
      cursor: pointer;
      transition: transform 0.4s ease;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      overflow: visible;
      z-index: 5;
    }

    .envelope::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffb3c6;
      clip-path: polygon(0 0, 100% 0, 50% 60%);
      border-radius: 14px 14px 0 0;
      transition: 0.6s ease;
      transform-origin: top;
      z-index: 6;
    }

    .envelope.open::before {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Letter */
    .letter {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 160px;
      background: white;
      border-radius: 12px;
      padding: 14px;
      box-sizing: border-box;
      transition: 0.9s ease;
      z-index: 7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .letter p {
      font-size: 1rem;
      color: #ff4f8b;
      margin: 0;
      line-height: 1.4;
      text-align: center;
    }

    /* Video inside letter (start state) */
    .letter video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    /* Pop-out animation */
    .envelope.open .letter {
      bottom: 110%;
      width: 200px;
      height: 356px;
      transform: translateX(-50%) scale(1.05);
      border-radius: 16px;
    }

    .envelope.open .letter video {
      display: block;
    }

    /* Final fullscreen center state */
    .letter.fullscreen {
      position: fixed;
      inset: 0;
      margin: auto;
      width: 90vw;
      max-width: 400px;
      height: auto;
      aspect-ratio: 9 / 16;
      background: black;
      z-index: 50;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .btn {
      margin-top: 22px;
      background: #ff4f8b;
      color: white;
      border: none;
      padding: 14px 26px;
      font-size: 1.05rem;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .btn:hover {
      background: #ff2f74;
      transform: scale(1.05);
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.6); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="container" id="mainUI">
    <h1>💌 Hi Jaanu 💌</h1>

    <div class="envelope-wrapper">
      <div class="envelope" id="envelope">
        <div class="letter" id="letter">
          <p id="text">
            Until I see you and actually give you the reaction you deserve,
            this is me putting my feelings into something I can actually send 💕
          </p>

          <video id="video" playsinline controls preload="auto">
            <source src="your_video.mp4" type="video/mp4">
          </video>
        </div>
      </div>
    </div>

    <button class="btn" id="openBtn">Open Letter 💖</button>
  </div>

  <script>
    const envelope = document.getElementById("envelope");
    const button = document.getElementById("openBtn");
    const letter = document.getElementById("letter");
    const text = document.getElementById("text");
    const video = document.getElementById("video");
    const mainUI = document.getElementById("mainUI");

    button.onclick = () => {
      envelope.classList.add("open");
      text.style.display = "none";
      video.style.display = "block";
      video.play();

      // After pop-out, expand to center fullscreen
      setTimeout(() => {
        letter.classList.add("fullscreen");
        mainUI.style.pointerEvents = "none";
      }, 900);

      // After expansion, hide envelope + button
      setTimeout(() => {
        envelope.style.display = "none";
        button.style.display = "none";
      }, 1300);
    };

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = ["💖","💕","💗","💝","💘"][Math.floor(Math.random()*5)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }, 400);
  </script>
</body>
</html>
