<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> My Valentine 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: linear-gradient(135deg, #ffd6e8, #ffeaf2);
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: #ff4f8b;
      margin-bottom: 25px;
      font-size: 2rem;
    }

    /* Envelope */
    .envelope {
      position: relative;
      width: 300px;
      height: 200px;
      background: #ff8fab;
      border-radius: 10px;
      margin: auto;
      cursor: pointer;
      transition: transform 0.4s ease;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }

    .envelope:hover {
      transform: scale(1.03);
    }

    .envelope:before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffb3c6;
      clip-path: polygon(0 0, 100% 0, 50% 50%);
      border-radius: 10px 10px 0 0;
      transition: 0.6s;
      transform-origin: top;
    }

    .letter {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 160px;
      background: white;
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      transition: 0.8s ease;
      overflow: hidden;
    }

    .letter p {
      font-size: 1rem;
      color: #ff4f8b;
      margin: 0;
      line-height: 1.4;
    }

    video {
      width: 100%;
      border-radius: 6px;
      display: none;
      margin-top: 6px;
    }

    .btn {
      margin-top: 20px;
      background: #ff4f8b;
      color: white;
      border: none;
      padding: 12px 22px;
      font-size: 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .btn:hover {
      background: #ff2f74;
      transform: scale(1.05);
    }

    /* Open state */
    .open:before {
      transform: rotateX(180deg);
    }

    .open .letter {
      bottom: 100px;
    }

    .open video {
      display: block;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.6); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>💌 Hi Jaanu 💌</h1>

    <div class="envelope" id="envelope">
      <div class="letter">
        <p id="text"> Until i see you and actually give you a reaction you deserve,this is me putting my feelings into something i can actually send :)) </p>
        <video id="video" controls>
          <source src="your-video.mp4" type="video/mp4">
        </video>
      </div>
    </div>

    <button class="btn" id="openBtn"> Open Letter 💕</button>
  </div>

  <script>
    const envelope = document.getElementById("envelope");
    const button = document.getElementById("openBtn");
    const text = document.getElementById("text");
    const video = document.getElementById("video");

    button.onclick = () => {
      envelope.classList.add("open");
      text.style.display = "none";
      video.style.display = "block";
      video.play();
    };

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = ["💖","💕","💗","💝","💘"][Math.floor(Math.random()*5)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }, 400);
  </script>
</body>
</html>
